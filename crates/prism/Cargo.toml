[package]
name = "prism"
description = "libvirt/KVM manager"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
mime_guess = "2.0.5"
prism-libvirt = { version = "0.1.0", path = "../prism-libvirt" }
quick-xml = "0.42.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
