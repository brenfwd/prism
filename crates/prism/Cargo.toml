[package]
name = "prism"
description = "KVM virtual machine manager: one static binary with an embedded web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
blake3 = { version = "1.8.7", features = ["pure"] }
bytes = "1.12.1"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
httparse = "1"
ipnet = { version = "2.12.2", features = ["serde"] }
mime_guess = "2.0.5"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
prism-cluster = { version = "0.1.0", path = "../prism-cluster" }
prism-iso = { version = "0.1.0", path = "../prism-iso" }
prism-libvirt = { version = "0.1.0", path = "../prism-libvirt" }
prism-net = { version = "0.1.0", path = "../prism-net" }
prism-proto = { version = "0.1.0", path = "../prism-proto" }
prism-web = { version = "0.1.0", path = "../../web" }
quick-xml = "0.42.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1.8"
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "channel", "transport"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
webpki-roots = "1"

[dev-dependencies]
tempfile = "3.27.0"
