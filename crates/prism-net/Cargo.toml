[package]
name = "prism-net"
description = "Netlink, nftables, WireGuard, DHCP and DNS primitives for Prism nodes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
dhcproto = "0.15.0"
futures = "0.3.34"
genetlink = "0.3.0"
getrandom = "0.4.3"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
ipnet = "2.12.2"
netlink-packet-core = "0.9.0"
netlink-packet-generic = "0.5.0"
netlink-packet-route = "0.33.0"
netlink-packet-wireguard = "0.5.0"
netlink-sys = "0.9.0"
rtnetlink = "0.23.0"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
zeroize = "1.9.1"

[dev-dependencies]
rustix = { version = "1.1.5", features = ["thread", "fs", "process"] }
serde_json = "1.0.154"
